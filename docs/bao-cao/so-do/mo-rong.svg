<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">SQLite v11 — các bảng mở rộng bán hàng</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98506a"/></marker></defs><rect width="1200" height="760" fill="#fffafc"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#502239">SQLite v11 — các bảng mở rộng bán hàng</text><path d="M195.0 210.0 L195.0 320.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M585.0 210.0 L585.0 320.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995.0 210.0 L995.0 320.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="80" width="310" height="130" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">users</text><text x="56" y="140" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Chủ địa chỉ / đánh giá / inbox</text><rect x="430" y="80" width="310" height="130" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">order_items / orders</text><text x="446" y="140" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Chứng minh chủ đơn đã giao</text><text x="446" y="165" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Snapshot tiền / coupon / ngày giao</text><rect x="830" y="80" width="330" height="130" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="846" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">order_events</text><text x="846" y="140" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Audit trạng thái trong transaction</text><rect x="40" y="320" width="310" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="351" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">addresses</text><text x="56" y="380" font-family="Arial,sans-serif" font-size="17" fill="#45343b">FK user_id / revision</text><text x="56" y="405" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Một mặc định tối đa / 10 địa chỉ</text><text x="56" y="430" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Checkout nhận bản sao</text><rect x="430" y="320" width="310" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="351" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">product_reviews</text><text x="446" y="380" font-family="Arial,sans-serif" font-size="17" fill="#45343b">FK user + dòng hàng đã mua</text><text x="446" y="405" font-family="Arial,sans-serif" font-size="17" fill="#45343b">UNIQUE user/order/product</text><text x="446" y="430" font-family="Arial,sans-serif" font-size="17" fill="#45343b">rating / comment / revision</text><rect x="830" y="320" width="330" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="846" y="351" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">user_notifications</text><text x="846" y="380" font-family="Arial,sans-serif" font-size="17" fill="#45343b">UNIQUE user_id + event_id</text><text x="846" y="405" font-family="Arial,sans-serif" font-size="17" fill="#45343b">type/entity / created_at / read_at</text><text x="846" y="430" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Ghi cùng transaction audit</text><rect x="430" y="590" width="380" height="130" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="621" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">coupon_rules</text><text x="446" y="650" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Chỉ demo / QA; thời hạn / điều kiện</text><text x="446" y="675" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Đơn lưu snapshot, không FK campaign</text></svg>