<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title"><title id="title">SQLite v5 — các quan hệ chính (chi tiết FK trong Mermaid)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98506a"/></marker></defs><rect width="1200" height="890" fill="#fffafc"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#502239">SQLite v5 — các quan hệ chính (chi tiết FK trong Mermaid)</text><path d="M430.0 135.0 L355.0 135.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745.0 135.0 L825.0 135.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M457.5 205.0 L336.8 270.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M587.5 205.0 L587.5 270.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M721.7 205.0 L846.2 270.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M197.5 420.0 L197.5 490.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M587.5 490.0 L587.5 420.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M724.7 490.0 L852.8 420.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M825.0 565.0 L745.0 565.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M197.5 640.0 L197.5 710.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M333.5 640.0 L460.5 710.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="430" y="65" width="315" height="140" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="96" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">users</text><text x="446" y="125" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK _id / UNIQUE email</text><text x="446" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">role / hash / salt / iterations</text><rect x="40" y="65" width="315" height="140" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="96" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">auth_session</text><text x="56" y="125" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK _id = 1</text><text x="56" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">FK user_id</text><rect x="825" y="65" width="330" height="140" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="841" y="96" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">shipping_details</text><text x="841" y="125" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK/FK user_id</text><text x="841" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">recipient / phone / address</text><rect x="40" y="270" width="315" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="301" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">checkout_requests</text><text x="56" y="330" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK request_id / UNIQUE user_id</text><text x="56" y="355" font-family="Arial,sans-serif" font-size="17" fill="#45343b">fingerprint / payload</text><rect x="430" y="270" width="315" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="301" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">cart_items</text><text x="446" y="330" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK user_id + product_id</text><text x="446" y="355" font-family="Arial,sans-serif" font-size="17" fill="#45343b">quantity / accepted_price_vnd</text><rect x="825" y="270" width="330" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="841" y="301" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">favorites</text><text x="841" y="330" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK user_id + product_id</text><text x="841" y="355" font-family="Arial,sans-serif" font-size="17" fill="#45343b">FK users / products</text><rect x="40" y="490" width="315" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">orders</text><text x="56" y="550" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK _id / FK user_id</text><text x="56" y="575" font-family="Arial,sans-serif" font-size="17" fill="#45343b">UNIQUE request_id / snapshot</text><rect x="430" y="490" width="315" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">products</text><text x="446" y="550" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK id / FK category_id</text><text x="446" y="575" font-family="Arial,sans-serif" font-size="17" fill="#45343b">price / stock / active / revision</text><rect x="825" y="490" width="330" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="841" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">categories</text><text x="841" y="550" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK id</text><text x="841" y="575" font-family="Arial,sans-serif" font-size="17" fill="#45343b">name / sort_order</text><rect x="40" y="710" width="315" height="140" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="741" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">order_items</text><text x="56" y="770" font-family="Arial,sans-serif" font-size="17" fill="#45343b">PK order_id + product_id</text><text x="56" y="795" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Tên / giá / số lượng snapshot</text><rect x="430" y="710" width="315" height="140" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="741" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">order_events</text><text x="446" y="770" font-family="Arial,sans-serif" font-size="17" fill="#45343b">FK order_id / actor_id</text><text x="446" y="795" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Trạng thái / người / thời gian</text></svg>