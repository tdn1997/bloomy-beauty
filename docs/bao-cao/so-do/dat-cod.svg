<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title"><title id="title">Đặt COD — thao tác trong transaction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98506a"/></marker></defs><rect width="1200" height="495" fill="#fffafc"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#502239">Đặt COD — thao tác trong transaction</text><path d="M370.0 142.5 L430.0 142.5" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M760.0 142.5 L830.0 142.5" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M595.0 210.0 L595.0 285.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M476.7 210.0 L345.2 285.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M760.0 365.0 L830.0 365.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="75" width="330" height="135" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="106" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">1. Kiểm tra trước đặt</text><text x="56" y="135" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Lưu giao hàng / UUID</text><text x="56" y="160" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Fingerprint + payload SQLite</text><rect x="430" y="75" width="330" height="135" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="106" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">2. Bắt đầu transaction</text><text x="446" y="135" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Đúng phiên / request / giỏ</text><text x="446" y="160" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Giá / tồn / địa chỉ khớp</text><rect x="830" y="75" width="330" height="135" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="846" y="106" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">3a. Đã có kết quả</text><text x="846" y="135" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Cùng mã + cùng nội dung</text><text x="846" y="160" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Trả đơn cũ / giữ giỏ mới</text><rect x="430" y="285" width="330" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="446" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">3b. Chưa có, hợp lệ</text><text x="446" y="345" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Trừ tồn / tăng revision</text><text x="446" y="370" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Ghi đơn + item snapshot + audit</text><text x="446" y="395" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Dọn giỏ lần đặt</text><rect x="830" y="285" width="330" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="846" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">4. Commit và hiển thị</text><text x="846" y="345" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Một đơn / một lần trừ tồn</text><text x="846" y="370" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Cold start đọc lại kết quả</text><rect x="40" y="285" width="330" height="160" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">Lỗi / xung đột</text><text x="56" y="345" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Rollback mọi thay đổi</text><text x="56" y="370" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Báo lỗi để sửa và xác nhận lại</text></svg>