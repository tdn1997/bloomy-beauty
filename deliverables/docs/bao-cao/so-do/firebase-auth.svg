<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title"><title id="title">B0/B1 — danh tính Cloud và local tách nguồn</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98506a"/></marker></defs><rect width="1200" height="570" fill="#fffafc"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#502239">B0/B1 — danh tính Cloud và local tách nguồn</text><path d="M360.0 167.5 L440.0 167.5" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M760.0 167.5 L840.0 167.5" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M600.0 245.0 L600.0 350.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M879.6 245.0 L716.5 350.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1000.0 245.0 L1000.0 350.0" stroke="#98506a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="90" width="320" height="155" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="121" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">CloudApp / ViewModel</text><text x="56" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Package .cloud / debug opt-in</text><text x="56" y="175" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Xóa state theo UID + nonce</text><text x="56" y="200" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Không khởi tạo SQLite local</text><rect x="440" y="90" width="320" height="155" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="456" y="121" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">Ports Auth / Accounts</text><text x="456" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">SDK Auth và HTTP callable</text><text x="456" y="175" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Guard trước / sau kết quả</text><text x="456" y="200" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Role listener chỉ yêu cầu tải lại</text><rect x="840" y="90" width="320" height="155" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="856" y="121" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">Cloud Functions</text><text x="856" y="150" font-family="Arial,sans-serif" font-size="17" fill="#45343b">accountInfo / verifyAdmin</text><text x="856" y="175" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Xác minh token + Auth user</text><text x="856" y="200" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Đọc role trong transaction</text><rect x="40" y="350" width="320" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="56" y="381" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">LocalDemo</text><text x="56" y="410" font-family="Arial,sans-serif" font-size="17" fill="#45343b">.demo / .qa / bản thường</text><text x="56" y="435" font-family="Arial,sans-serif" font-size="17" fill="#45343b">SQLite v11 / lịch sử local</text><text x="56" y="460" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Care Provider + receivers bật</text><rect x="440" y="350" width="320" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="456" y="381" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">Firebase Auth Emulator</text><text x="456" y="410" font-family="Arial,sans-serif" font-size="17" fill="#45343b">UID chuỗi / email / displayName</text><text x="456" y="435" font-family="Arial,sans-serif" font-size="17" fill="#45343b">SDK lưu phiên / logout riêng</text><text x="456" y="460" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Không gộp theo email local</text><rect x="840" y="350" width="320" height="150" rx="15" fill="#fff" stroke="#d5a9bb" stroke-width="2"/><text x="856" y="381" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#79334f">Firestore Emulator</text><text x="856" y="410" font-family="Arial,sans-serif" font-size="17" fill="#45343b">roles/{uid}: server ghi</text><text x="856" y="435" font-family="Arial,sans-serif" font-size="17" fill="#45343b">users/{uid}: bootstrap theo UID</text><text x="856" y="460" font-family="Arial,sans-serif" font-size="17" fill="#45343b">Chủ chỉ đọc đúng dữ liệu mình</text></svg>